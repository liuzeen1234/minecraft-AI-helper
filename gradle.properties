# 强制 UTF-8 编码，避免 Windows 下中文乱码
org.gradle.jvmargs=-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8

# 让 Gradle 守护进程本身用 JDK 17 启动，这样无需每次带 JAVA_HOME 即可 ./gradlew runClient。
# 注意：这是本机绝对路径，换机器 / 协作者需按自己的 JDK 17 安装位置调整（或删除此行改用 JAVA_HOME）。
org.gradle.java.home=/opt/homebrew/Cellar/openjdk@17/17.0.20.1/libexec/openjdk.jdk/Contents/Home

# Fabric Properties
minecraft_version=1.20.4
yarn_mappings=1.20.4+build.3
loader_version=0.15.6

# Mod Properties
mod_version=1.3.1
maven_group=com.example
archives_base_name=ai-builder

# Dependencies
fabric_version=0.95.4+1.20.4

# 覆盖全局 ~/.gradle/gradle.properties 中的本地代理(127.0.0.1:7897)，强制直连。
# 项目级配置优先级高于全局，这样直接执行 ./gradlew runClient 即走直连，无需带 -D 参数。
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=
